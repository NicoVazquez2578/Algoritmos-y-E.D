<text x="635" y="403" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e1e1e" text-anchor="start">Vector de predecesores (desde B):</text>
<rect x="635" y="413" width="570" height="172" fill="#ebfbee" stroke="#2f9e44" stroke-width="1" rx="3"/>
<text x="650" y="438" font-family="'Courier New',monospace" font-size="14" fill="#2f9e44" font-weight="bold">pred[A] = B</text>
<text x="756" y="438" font-family="'Courier New',monospace" font-size="14" fill="#555">→  B → A         </text>
<text x="1060" y="438" font-family="'Courier New',monospace" font-size="14" fill="#888">costo: 7</text>
<text x="650" y="468" font-family="'Courier New',monospace" font-size="14" fill="#2f9e44" font-weight="bold">pred[B] = —</text>
<text x="756" y="468" font-family="'Courier New',monospace" font-size="14" fill="#555">→  [origen]      </text>
<text x="1060" y="468" font-family="'Courier New',monospace" font-size="14" fill="#888">costo: 0</text>
<text x="650" y="498" font-family="'Courier New',monospace" font-size="14" fill="#2f9e44" font-weight="bold">pred[C] = B</text>
<text x="756" y="498" font-family="'Courier New',monospace" font-size="14" fill="#555">→  B → C         </text>
<text x="1060" y="498" font-family="'Courier New',monospace" font-size="14" fill="#888">costo: 1</text>
<text x="650" y="528" font-family="'Courier New',monospace" font-size="14" fill="#2f9e44" font-weight="bold">pred[D] = B</text>
<text x="756" y="528" font-family="'Courier New',monospace" font-size="14" fill="#555">→  B → D         </text>
<text x="1060" y="528" font-family="'Courier New',monospace" font-size="14" fill="#888">costo: 2</text>
<text x="650" y="558" font-family="'Courier New',monospace" font-size="14" fill="#2f9e44" font-weight="bold">pred[E] = D</text>
<text x="756" y="558" font-family="'Courier New',monospace" font-size="14" fill="#555">→  B → D → E    </text>
<text x="1060" y="558" font-family="'Courier New',monospace" font-size="14" fill="#888">costo: 6</text>
<text x="635" y="606" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e1e1e" text-anchor="start">Pseudocódigo – imprimirCamino(pred, origen, destino):</text>
<rect x="635" y="616" width="570" height="268" fill="#f3f0ff" stroke="#7048e8" stroke-width="1" rx="3"/>
<text x="650" y="640" font-family="'Courier New',monospace" font-size="14" fill="#1e1e1e">1.  camino &#x2190; Pila vacía</text>
<text x="650" y="668" font-family="'Courier New',monospace" font-size="14" fill="#1e1e1e">2.  actual &#x2190; destino</text>
<text x="650" y="696" font-family="'Courier New',monospace" font-size="14" fill="#1e1e1e">3.  MIENTRAS actual &#x2260; origen:</text>
<text x="650" y="724" font-family="'Courier New',monospace" font-size="14" fill="#1e1e1e">4.      camino.push(actual)</text>
<text x="650" y="752" font-family="'Courier New',monospace" font-size="14" fill="#1e1e1e">5.      actual &#x2190; pred[actual]</text>
<text x="650" y="780" font-family="'Courier New',monospace" font-size="14" fill="#1e1e1e">6.  camino.push(origen)</text>
<text x="650" y="808" font-family="'Courier New',monospace" font-size="14" fill="#1e1e1e">7.  MIENTRAS camino no vacía:</text>
<text x="650" y="836" font-family="'Courier New',monospace" font-size="14" fill="#1e1e1e">8.      imprimir camino.pop()</text>
<text x="650" y="864" font-family="'Courier New',monospace" font-size="14" fill="#1e1e1e">9.      SI camino no vacía: imprimir " → "</text>
