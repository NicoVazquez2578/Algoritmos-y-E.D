<line x1="377.9" y1="391.5" x2="442.1" y2="468.5" stroke="#0c8599" stroke-width="1.8" marker-end="url(#ah-teal)"/>
<text x="428.0" y="430.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0c8599" text-anchor="middle">2</text>
<line x1="460.0" y1="462.0" x2="460.0" y2="188.0" stroke="#2f9e44" stroke-width="1.8" marker-end="url(#ah-green)"/>
<text x="478.0" y="325.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f9e44" text-anchor="middle">3</text>
<line x1="202.8" y1="462.9" x2="432.2" y2="487.1" stroke="#e03131" stroke-width="1.8" marker-end="url(#ah-red)"/>
<text x="317.5" y="489.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e03131" text-anchor="middle">1</text>
<text x="635" y="72" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e1e1e" text-anchor="start">Matrices Floyd-Warshall:</text>
<rect x="635" y="83" width="570" height="298" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1" rx="3"/>
<rect x="635" y="83" width="570" height="32" fill="#e9ecef" stroke="#adb5bd" stroke-width="1" rx="3"/>
<text x="648" y="105" font-family="'Courier New',monospace" font-size="13" font-weight="bold" fill="#1e1e1e">D0 (inicial)                       D* (final)</text>
<line x1="635" y1="115" x2="1205" y2="115" stroke="#adb5bd" stroke-width="1"/>
<text x="648" y="135" font-family="'Courier New',monospace" font-size="13" fill="#555">      A    B    C    D    E</text>
<text x="880" y="135" font-family="'Courier New',monospace" font-size="13" fill="#555">      A    B    C    D    E</text>
<text x="648" y="155" font-family="'Courier New',monospace" font-size="13" fill="#1e1e1e">A [  0    ∞    1    4    ∞]</text>
<text x="880" y="155" font-family="'Courier New',monospace" font-size="13" fill="#1971c2" font-weight="bold">A [  0    5    1    4    2]</text>
<text x="648" y="193" font-family="'Courier New',monospace" font-size="13" fill="#1e1e1e">B [  6    0    ∞    ∞    ∞]</text>
<text x="880" y="193" font-family="'Courier New',monospace" font-size="13" fill="#1971c2" font-weight="bold">B [  6    0    7   10    8]</text>
<text x="648" y="231" font-family="'Courier New',monospace" font-size="13" fill="#1e1e1e">C [  ∞    ∞    0    5    1]</text>
<text x="880" y="231" font-family="'Courier New',monospace" font-size="13" fill="#1971c2" font-weight="bold">C [ 10    4    0    5    1]</text>
<text x="648" y="269" font-family="'Courier New',monospace" font-size="13" fill="#1e1e1e">D [  ∞    3    ∞    0    2]</text>
<text x="880" y="269" font-family="'Courier New',monospace" font-size="13" fill="#1971c2" font-weight="bold">D [  9    3   10    0    2]</text>
<text x="648" y="307" font-family="'Courier New',monospace" font-size="13" fill="#1e1e1e">E [  ∞    3    ∞    ∞    0]</text>
<text x="880" y="307" font-family="'Courier New',monospace" font-size="13" fill="#1971c2" font-weight="bold">E [  9    3   10   13    0]</text>
<text x="635" y="403" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e1e1e" text-anchor="start">Matriz de predecesores P*:</text>
<rect x="635" y="413" width="570" height="168" fill="#fff3cd" stroke="#e67700" stroke-width="1" rx="3"/>
<text x="648" y="435" font-family="'Courier New',monospace" font-size="14" fill="#555">       A    B    C    D    E</text>
<text x="648" y="457" font-family="'Courier New',monospace" font-size="14" fill="#1e1e1e">  A [  —    E    A    A    C]</text>
<text x="648" y="483" font-family="'Courier New',monospace" font-size="14" fill="#1e1e1e">  B [  B    —    A    A    C]</text>
<text x="648" y="509" font-family="'Courier New',monospace" font-size="14" fill="#1e1e1e">  C [  E    E    —    C    C]</text>
<text x="648" y="535" font-family="'Courier New',monospace" font-size="14" fill="#1e1e1e">  D [  B    D    B    —    D]</text>
<text x="648" y="561" font-family="'Courier New',monospace" font-size="14" fill="#1e1e1e">  E [  B    E    B    B    —]</text>
<text x="635" y="604" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e1e1e" text-anchor="start">Análisis del grafo (Figura 1):</text>
<rect x="635" y="614" width="570" height="270" fill="#e3fafc" stroke="#0c8599" stroke-width="1" rx="3"/>
<text x="650" y="636" font-family="'Courier New',monospace" font-size="13" fill="#1e1e1e" font-weight="normal">Camino mínimo A &#x2192; E:</text>
<text x="650" y="656" font-family="'Courier New',monospace" font-size="13" fill="#1e1e1e" font-weight="normal">  P*[A][E]=C &#x2192; P*[A][C]=A</text>
<text x="650" y="676" font-family="'Courier New',monospace" font-size="13" fill="#1e1e1e" font-weight="normal">  Camino: A &#x2192; C &#x2192; E    costo = 2</text>
<text x="650" y="696" font-family="'Courier New',monospace" font-size="13" fill="#1e1e1e" font-weight="normal"></text>
<text x="650" y="716" font-family="'Courier New',monospace" font-size="13" fill="#1e1e1e" font-weight="normal">Excentricidades (max dist. desde cada vértice):</text>
<text x="650" y="736" font-family="'Courier New',monospace" font-size="13" fill="#e67700" font-weight="normal">  ecc(A) = max(0, 5, 1, 4, 2)  =  5   &#x2190; mínima</text>
<text x="650" y="756" font-family="'Courier New',monospace" font-size="13" fill="#1e1e1e" font-weight="normal">  ecc(B) = max(6, 0, 7,10, 8)  = 10</text>
<text x="650" y="776" font-family="'Courier New',monospace" font-size="13" fill="#1e1e1e" font-weight="normal">  ecc(C) = max(10,4, 0, 5, 1)  = 10</text>
<text x="650" y="796" font-family="'Courier New',monospace" font-size="13" fill="#1e1e1e" font-weight="normal">  ecc(D) = max( 9,3,10, 0, 2)  = 10</text>
<text x="650" y="816" font-family="'Courier New',monospace" font-size="13" fill="#1e1e1e" font-weight="normal">  ecc(E) = max( 9,3,10,13, 0)  = 13</text>
<text x="650" y="836" font-family="'Courier New',monospace" font-size="13" fill="#1e1e1e" font-weight="normal"></text>
<text x="650" y="856" font-family="'Courier New',monospace" font-size="13" fill="#e67700" font-weight="bold">Centro del grafo = A   (excentricidad = 5)</text>
</svg>