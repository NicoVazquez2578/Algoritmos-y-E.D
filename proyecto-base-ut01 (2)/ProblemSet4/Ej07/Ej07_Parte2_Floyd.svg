<line x1="199.1" y1="274.3" x2="335.9" y2="355.7" stroke="#1971c2" stroke-width="1.8" marker-end="url(#ah-blue)"/>
<text x="281.5" y="315.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1971c2" text-anchor="middle">4</text>
<line x1="372.0" y1="344.7" x2="448.0" y2="185.3" stroke="#2f9e44" stroke-width="1.8" marker-end="url(#ah-green)"/>
<text x="424.0" y="257.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f9e44" text-anchor="middle">3</text>
<line x1="175.0" y1="288.0" x2="175.0" y2="432.0" stroke="#e67700" stroke-width="1.8" marker-end="url(#ah-orange)"/>
<text x="159.0" y="360.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e67700" text-anchor="middle">1</text>
<line x1="200.2" y1="447.8" x2="334.8" y2="382.2" stroke="#7048e8" stroke-width="1.8" marker-end="url(#ah-purple)"/>
