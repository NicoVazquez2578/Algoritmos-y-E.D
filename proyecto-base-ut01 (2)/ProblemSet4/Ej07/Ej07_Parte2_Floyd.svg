<text x="460" y="490" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">E</text>
<line x1="433.6" y1="169.3" x2="201.4" y2="250.7" stroke="#e03131" stroke-width="1.8" marker-end="url(#ah-red)"/>
